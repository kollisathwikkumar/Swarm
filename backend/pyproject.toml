[project]
name = "swarm-backend"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "S", "ASYNC", "PIE", "PERF", "SIM", "FURB"]
ignore = [
    "E501",     # long prompt/doc literals
    "B904",     # FastAPI HTTPException translation raises intentionally omit traceback noise
    "ASYNC109", # timeout_seconds is an explicit wrapper timeout parameter
    "ASYNC240", # small isolated workspace Path checks are bounded and fast
    "PERF401",  # explicit append loops remain clearer than multi-field dict comprehensions
    "S104",     # bind all interfaces if configured
    "S105",     # test fixture password strings
    "S106",     # test fixture password args
    "S108",     # temp path defaults
    "S603",     # subprocess exec calls use list args (shell=False)
    "S607",     # git binary lookup by PATH
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E402"]
"**/tests/**" = ["S101", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Body",
]
